services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      FIELDSHIFT_CORS_ORIGINS: ${FIELDSHIFT_CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - cache:/data/cache
  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FIELDSHIFT_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  cache:
